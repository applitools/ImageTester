name: Release

permissions:
  contents: read

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry run: builds artifacts, never creates a release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Scan tracked files for customer data
        run: bash .githooks/pii-guard.sh --all

      - name: Resolve version and validate tag
        id: ver
        shell: bash
        run: |
          POM_VERSION=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "pom version: $POM_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "Tag '$TAG' does not match v<major>.<minor>.<patch>[-suffix]" >&2
              exit 1
            fi
            BASE="${TAG#v}"
            BASE="${BASE%%-*}"
            if [[ "$BASE" != "$POM_VERSION" ]]; then
              echo "Tag base version '$BASE' does not match pom version '$POM_VERSION'." >&2
              echo "Bump the pom or re-tag so installer metadata and asset names agree." >&2
              exit 1
            fi
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: validate
    strategy:
      # One OS failing must not cancel the other installers mid-build.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS-AppleSilicon
          # macos-13 was retired from the hosted fleet; macos-15-intel is the x64 label
          - os: macos-15-intel
            label: macOS-Intel
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    env:
      # GitHub Actions cannot reference secrets in `if:` directly; surface presence via env.
      HAS_WINDOWS_SIGNING: ${{ secrets.WINDOWS_SIGNING_CERT != '' }}
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_SIGNING_CERT != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Build installer
        # bash on every OS: Windows' default pwsh splits -Dowasp.skip=true at the dot
        shell: bash
        run: mvn -Pgui-installers -DskipTests -Dowasp.skip=true clean verify --batch-mode

      # Signing seam: fail loudly if secrets exist before signing is implemented,
      # so a "signed" release can never silently ship unsigned.
      - name: Sign installer (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_SIGNING == 'true'
        shell: bash
        run: |
          echo "WINDOWS_SIGNING_CERT is configured but Authenticode signing is not implemented yet." >&2
          echo "Implement this step (signtool/SignPath) before setting the secret." >&2
          exit 1

      - name: Sign and notarize installer (macOS)
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        run: |
          echo "APPLE_SIGNING_CERT is configured but Developer ID signing/notarization is not implemented yet." >&2
          echo "Implement this step (codesign + notarytool) before setting the secret." >&2
          exit 1

      - name: Rename installer to customer-facing name
        shell: bash
        run: |
          cd target/installers
          count=$(ls | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one installer in target/installers, found $count:" >&2
            ls >&2
            exit 1
          fi
          file=$(ls)
          ext="${file##*.}"
          mv "$file" "ImageTester-${{ needs.validate.outputs.version }}-${{ matrix.label }}.${ext}"
          ls

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.label }}
          path: target/installers/*
          if-no-files-found: error

  build-jars:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      # Platform jars differ only by which eyes-universal-core binary is bundled,
      # so a single Linux build produces all seven (frontend-maven-plugin installs
      # its own Node for the GUI bundle).
      - name: Build CLI jars (universal + six platform jars)
        run: mvn -DskipTests package --batch-mode

      - name: Verify expected jars exist
        shell: bash
        run: |
          cd jars
          # Jars are named with the pom version; a suffixed tag (v1.2.3-rc1) still builds 1.2.3 jars.
          BASE="${{ needs.validate.outputs.version }}"
          BASE="${BASE%%-*}"
          for suffix in "" "_Windows" "_Mac" "_MacArm" "_Linux" "_Alpine" "_Arm"; do
            f="ImageTester_${BASE}${suffix}.jar"
            if [ ! -f "$f" ]; then
              echo "Missing expected jar: $f" >&2
              ls >&2
              exit 1
            fi
          done
          ls -la ImageTester_*.jar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-jars
          path: jars/ImageTester_*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, build, build-jars]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f -not -name SHA256SUMS.txt -exec sha256sum {} \; | sed 's|\./||' > /tmp/SHA256SUMS.txt
          mv /tmp/SHA256SUMS.txt SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Prepare release notes
        shell: bash
        run: |
          # Demo phase ships unsigned, so the UNSIGNED block stays in.
          # When the signing seam is implemented, strip the block here for signed builds:
          #   sed -i '/<!-- UNSIGNED-START -->/,/<!-- UNSIGNED-END -->/d' body.md
          sed "s/{{VERSION}}/${{ needs.validate.outputs.version }}/g" .github/release-template.md > body.md
          cat body.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.validate.outputs.tag }}" \
            --latest \
            --title "ImageTester GUI ${{ needs.validate.outputs.tag }} (demo)" \
            --notes-file body.md \
            dist/*
