name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pii-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Scan tracked files for customer data
        run: bash .githooks/pii-guard.sh --all

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Run unit tests
        run: mvn test --batch-mode --fail-at-end

  jar-smoke:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Package shaded jar
        shell: bash
        run: mvn -DskipTests package --batch-mode

      # Runs the real shaded jar on no-network paths so shading/classpath breakage
      # (e.g. the jackson/EyesUtilities ordering NoSuchMethodError) fails CI even
      # on fork PRs where the Eyes E2E job cannot run.
      - name: Smoke-test the packaged jar
        shell: bash
        run: |
          # package emits 7 jars (universal + per-platform); pick the universal one by pom version
          VER=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          JAR=jars/ImageTester_${VER}.jar
          echo "Smoking $JAR"
          java -jar "$JAR"
          if java -jar "$JAR" -rwo smoke-out; then
            echo "::error::-rwo without -rw should exit non-zero"
            exit 1
          fi
          java -jar "$JAR" -rw WATERMARK -rwo smoke-out -f TestData/b
          find smoke-out -name '*.pdf' | grep -q .

  eyes-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    # Only runs where the APPLITOOLS_API_KEY secret can exist: upstream-repo runs
    # not triggered by Dependabot (Dependabot runs get only Dependabot secrets,
    # forks get none). The fail-loudly step below then guards genuine secret loss.
    if: >-
      github.repository == 'applitools/ImageTester' &&
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || !github.event.pull_request.head.repo.fork)
    env:
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      # A silently skipped E2E job is how flag breakage ships (#49); when this
      # job runs, the key must be present or the run fails visibly.
      - name: Fail loudly when the API key is unavailable
        if: env.APPLITOOLS_API_KEY == ''
        shell: bash
        run: |
          echo "::error::APPLITOOLS_API_KEY is not available - the Eyes E2E suite cannot run."
          exit 1

      # Tests/MultiFormatIntegrationTest converts Office-document fixtures via
      # LibreOffice; without it those runs exit 2 (skipped files) and the suite fails.
      - name: Install LibreOffice
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice

      - name: Package shaded jar
        shell: bash
        run: mvn -DskipTests package --batch-mode

      - name: Run Eyes E2E suite against the packaged jar
        shell: bash
        run: |
          VER=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          mvn test --batch-mode -Peyes-tests -Djar="jars/ImageTester_${VER}.jar"

  gui-installers:
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Build installer
        # bash on every OS: Windows' default pwsh splits -Dowasp.skip=true at the dot
        shell: bash
        run: mvn -Pgui-installers -DskipTests -Dowasp.skip=true clean verify --batch-mode

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imagetester-installer-${{ matrix.os }}
          path: target/installers/*
          if-no-files-found: error
