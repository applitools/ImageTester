name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Run unit tests
        run: mvn test --batch-mode --fail-at-end

  eyes-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
          cache: maven

      - name: Run Eyes integration tests
        if: env.APPLITOOLS_API_KEY != ''
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
        run: mvn test --batch-mode -Peyes-tests

  gui-installers:
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build installer
        run: mvn -Pgui-installers -DskipTests -Dowasp.skip=true clean verify --batch-mode

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: imagetester-installer-${{ matrix.os }}
          path: target/installers/*
          if-no-files-found: error
